    let currentQuestionIndex = 0;

    // Función para barajar (randomizar) un array
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // Inicializar el quiz
    function startQuiz() {
        // Barajamos el orden de las preguntas para que no salgan siempre igual
        shuffleArray(questions);
        document.getElementById('total-q').textContent = questions.length;
        loadQuestion();
    }

    function loadQuestion() {
        const qData = questions[currentQuestionIndex];

        // Actualizar UI
        document.getElementById('current-q').textContent = currentQuestionIndex + 1;
        document.getElementById('category-title').textContent = qData.category;
        document.getElementById('question-text').textContent = qData.question;
        document.getElementById('feedback-msg').textContent = "";
        document.getElementById('next-btn').style.display = "none";

        const optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = ""; // Limpiar opciones anteriores

        // Barajar las opciones de respuesta (Aquí está la lógica "1,4,2,1,3")
        // Clonamos las opciones para no alterar el objeto original
        let currentOptions = [...qData.options];
        shuffleArray(currentOptions);

        currentOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.textContent = opt.text;
            btn.onclick = () => checkAnswer(btn, opt.correct);
            optionsBox.appendChild(btn);
        });
    }

    function checkAnswer(btn, isCorrect) {
        // Si ya adivinó, no dejar hacer clic en otros botones incorrectos
        if (document.getElementById('next-btn').style.display === "inline-block") return;

        if (isCorrect) {
            btn.classList.add('correct');
            document.getElementById('feedback-msg').textContent = "¡Correcto! Muy bien.";
            document.getElementById('feedback-msg').style.color = "#28a745";

            // Mostrar botón siguiente
            document.getElementById('next-btn').style.display = "inline-block";

            // Deshabilitar el resto de botones para que no siga clicando
            const allBtns = document.querySelectorAll('.options button');
            allBtns.forEach(b => b.disabled = true);
            btn.disabled = false; // Dejar el correcto visiblemente activo (aunque bloqueado por CSS)

        } else {
            btn.classList.add('incorrect');
            document.getElementById('feedback-msg').textContent = "Incorrecto, inténtalo de nuevo.";
            document.getElementById('feedback-msg').style.color = "#dc3545";
            // No mostramos el botón siguiente, forzando al usuario a elegir otra.
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz-box').style.display = "none";
            document.getElementById('result-box').style.display = "block";
            document.querySelector('.progress').style.display = "none";
        }
    }

    // Arrancar al cargar
    window.onload = startQuiz;

</script>

</body>
</html>
